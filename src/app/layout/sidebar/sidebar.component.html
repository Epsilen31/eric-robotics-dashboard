<aside aria-label="Main navigation">
  <a class="logo" href="./" aria-label="ERIC home">ERIC<span>®</span><small>ROBOTICS</small></a>
  <nav>
    @for (item of items; track item.action) {
      <button
        type="button"
        [class.active]="isSelected(item.action)"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
        [attr.aria-pressed]="isSelected(item.action)"
        (click)="select(item.action)"
      >
        <svg
          [class.dashboard-icon]="item.action === actions.Camera"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path [attr.d]="item.path" />
        </svg>
      </button>
    }
  </nav>
  <div class="user" aria-label="User profile" role="img">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="8" r="3.2" />
      <path d="M5.5 21v-3a6.5 6.5 0 0 1 13 0v3" />
    </svg>
  </div>
</aside>
